name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Validate tag and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          root = pathlib.Path.cwd()
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match package version {expected!r}")

          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## {version} "
          start = changelog.find(marker)
          if start < 0:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          end = changelog.find("\n## ", start + len(marker))
          notes = changelog[start : end if end >= 0 else None].strip() + "\n"
          (root / "release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Build wheel and source archive
        run: python -m build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Cachaza $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest
